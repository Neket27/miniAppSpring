#Swagger
springdoc:
  swagger-ui:
    path: /ui
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /api-docs



spring:
  application:
    name: api-gateway

  # DB
  datasource:
    url: jdbc:postgresql://localhost:5433/miniapp_db
    username: miniapp
    password: miniapp
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: update
        globally_quoted_identifiers: true # ( user, order, group)
    generate-ddl: false
    show-sql: false

