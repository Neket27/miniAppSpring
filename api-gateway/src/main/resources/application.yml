      refreshToken: 86000

#  cloud:
#    gateway:
#      mvc:
#        routes:
#          - id: mini-app
#            predicates:
#              - Path=/ui
#            uri: http://localhost:8082

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders: "*"
      routes:
        - id: mini-app
          uri: http://localhost:8082
          predicates:
            - Path=/**
            - Method=GET,POST
#          filters:
#            - RewritePath=/mini-app(?<remaining>/.*),${remaining}
#            - TokenRelay=/






eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

