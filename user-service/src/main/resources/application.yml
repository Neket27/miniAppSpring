server:
  address: 0.0.0.0
  port: 8086

#Swagger
springdoc:
  swagger-ui:
    path: /ui
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /api-docs

spring:
  application:
    name: user-service

  config:
    import: optional:file:.env[.properties]



  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000

  # DB
  datasource:
    url: jdbc:postgresql://localhost:5436/user-service-miniapp_db
    username: user-service-miniapp
    password: user-service-miniapp
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: update
        globally_quoted_identifiers: true # ( user, order, group)
    generate-ddl: true
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    password: user-service-miniapp
    user: user-service-miniapp

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8888/eureka/
    register-with-eureka: true
    fetch-registry: true

#Log
logging:
  level:
    root: info



