services:

  db-postgres:
    image: postgres:16.1-alpine
    container_name: db_miniapp
    environment:
      POSTGRES_DB: miniapp_db
      POSTGRES_USER: miniapp
      POSTGRES_PASSWORD: miniapp
    ports:
      - "5433:5432"


  cache:
    container_name: redis_container_cache
    image: "redis"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - ./redisdata:/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 0.0.0.0" > /usr/local/etc/redis/redis.conf &&
        echo "requirepass $REDIS_PASSWORD" >> /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user default on nopass ~* +@all" > /usr/local/etc/redis/users.acl &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD ~* +@all" >> /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    tty: true
    stdin_open: true



  backend:
    build:
      context: ./
      dockerfile: backend/Dockerfile
    container_name: miniAppSpring_backend
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./
      dockerfile: frontend/Dockerfile
    container_name: miniAppSpring_frontend
    ports:
      - "5174:5173"
