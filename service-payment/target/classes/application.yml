#Swagger
# custom path for swagger-ui path: http://localhost:8080/ui
springdoc:
  swagger-ui:
    path: /ui
    operationsSorter: alpha
    tagsSorter: alpha
# custom path for api docs
  api-docs:
    path: /api-docs


spring:
  application:
    name: mini-app

  cache:
    type: redis
    cache-names: redis-cache
  data:
    redis:
      host: localhost
      port: 6380
      username: cache
      password: cache
      database: 1

  ai:
    mistralai:
      api-key: FtNwAtAuDFBaIrUePWFpAqxjxPr31U1y
      chat:
        options:
          model: mistral-small-latest
          temperature: 2

  # DB
  datasource:
    url: jdbc:postgresql://localhost:5433/miniapp_db
    username: miniapp
    password: miniapp
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: update
        globally_quoted_identifiers: true # ( user, order, group)
    generate-ddl: false
    show-sql: false


  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    password: miniapp
    user: miniapp

